<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖记录后台</title>
<style>
body{background:#0a0a0f;color:#fff;font-family:Arial;padding:20px;}
.container{max-width:500px;margin:0 auto;}
h2{color:#00b4ff;text-align:center;margin-bottom:20px;}
.log-item{background:#12121b;padding:12px 15px;border-radius:8px;margin-bottom:10px;}
.time{color:#888;font-size:12px;}
.user{color:#fff;margin:4px 0;}
.prize{color:#00b4ff;font-weight:bold;}
</style>
</head>
<body>
<div class="container">
  <h2>📋 抽奖记录后台</h2>
  <div id="logs"></div>
</div>

<script>
// 这里换成你的 Google 表格发布地址（发布为网页）
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/xxxx/pubhtml?gid=0&single=true";

async function loadRecords() {
  try {
    let res = await fetch(SHEET_URL);
    let text = await res.text();
    document.getElementById("logs").innerHTML = "<p>加载成功，请打开 Google 表格查看</p><p>"+SHEET_URL+"</p>";
  }catch(e){
    document.getElementById("logs").innerHTML = "<p>请在 Google Apps Script 部署后查看</p>";
  }
}
loadRecords();
</script>
</body>
</html>
